[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-search-mestrado"
version = "0.1.0"
description = "Busca reproduzivel no ACL Anthology para a revisao do mestrado"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["acl-anthology>=1.3"]

[project.scripts]
acl-search = "acl_search.search:main"

[tool.setuptools.packages.find]
where = ["src"]

